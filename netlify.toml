[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled function: weekly digest.
# Schedule is registered via schedule() in netlify/functions/weekly-digest.js
# at "0 2 * * 1" UTC = Monday 02:00 UTC = Sunday 21:00 America/Bogota.
# Excluded from public HTTP routing — Netlify still allows scheduled invocations.

[dev]
  publish = "public"
  functions = "netlify/functions"
  port = 8888

# Friendly URLs: /api/* → Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for the static PWA (built in Phase 3)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
